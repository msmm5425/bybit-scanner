name: Bybit Weekly Performance Report

on:
  schedule:
    # 매주 월요일(1) 낮 12:48 KST 대기열 진입 -> 약 13:00 KST 발송 (UTC 기준 월요일 03:48)
    - cron: '48 3 * * 1'
  workflow_dispatch: # 깃허브 Actions 탭에서 언제든 수동 테스트 실행 가능

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. 저장소 전체 기록(Git History) 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 지난 일주일간의 bot_state.json 커밋 기록을 모두 읽기 위해 필수!

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 4. 주간 성과 결산 리포트 실행 (weekly_report.py)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python weekly_report.py
