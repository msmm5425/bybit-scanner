name: Weekly Performance Report

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly_report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. 저장소 코드 및 최근 히스토리 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 500

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 필수 라이브러리 설치
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas numpy; fi

      - name: 4. 위클리 리포트 실행 (weekly_report.py)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python weekly_report.py
