name: Bybit Multi-Timeframe Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: bybit-scanner-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 필수 라이브러리 설치
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas numpy; fi

      - name: 4. 멀티프레임 스캐너 1회 실행 (scanner.py)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python scanner.py

      - name: 5. 상태 파일(bot_state.json) 무충돌 안전 저장
        run: |
          if [ -f bot_state.json ]; then
            cp bot_state.json /tmp/bot_state_backup.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git reset --hard origin/main
            mv /tmp/bot_state_backup.json bot_state.json
            git add bot_state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update scanner state [skip ci]"
              git push origin HEAD:main
            fi
          fi
