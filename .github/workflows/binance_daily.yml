name: Bybit Top 5 Daily DNA Learner

on:
  schedule:
    # 매일 08:45 KST (정각 스캐너 시작 15분 전 백그라운드 자동 학습 실행)
    - cron: '45 23 * * *'
  workflow_dispatch:

concurrency:
  group: bybit-daily-analyzer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pip requests pandas numpy

      - name: Run Daily Top 5 DNA & Market Cap Learner (Background)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BYBIT_PROXY_URL: ${{ secrets.BYBIT_PROXY_URL }}
        run: python binance_analyzer.py

      - name: Commit & Push Learned DNA Profile, Market Cap Cache & History
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add analyzer_history.json top5_dna_profile.json market_cap_cache.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update top5 dna profile, market cap cache & history [skip ci]"
            for i in 1 2 3; do
              git fetch origin main && git rebase origin/main || true
              if git push origin HEAD:main; then
                break
              fi
              sleep 2
            done
          fi