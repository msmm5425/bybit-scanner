name: Bybit Multi-Timeframe Scanner

on:
  schedule:
    - cron: '*/50 * * * *'
  workflow_dispatch:

concurrency:
  group: bybit-scanner-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 및 차트 엔진 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy playwright
          playwright install --with-deps chromium

      - name: 4. 5분 주기 멀티프레임 스캔 및 무충돌 상태 동기화
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          for i in {1..10}; do
            echo "=== [회차 $i/10] 5분 주기 스캔 시작: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
            git fetch origin main || true
            git reset --hard origin/main || true

            python scanner.py || echo "[경고] 스캔 실행 중 일시적 예외 발생"

            if [ -f scanner_state.json ]; then
              cp scanner_state.json /tmp/scanner_state_backup.json
              git fetch origin main || true
              git checkout origin/main -- . || true
              cp /tmp/scanner_state_backup.json scanner_state.json
              git add scanner_state.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: update scanner state [skip ci]" || true
                git push origin HEAD:main || true
              fi
            fi

            if [ "$i" -lt 10 ]; then
              echo "다음 5분 스캔까지 296초 대기..."
              sleep 296
            fi
          done
