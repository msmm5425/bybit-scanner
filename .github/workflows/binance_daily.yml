name: Binance Pre-Surge Analyzer

on:
  schedule:
    # 한국시간(KST) 매일 오전 08:00(UTC 23시), 오후 15:00(UTC 6시), 오후 20:00(UTC 11시) 실행
    - cron: '0 6,11,23 * * *'
  workflow_dispatch:  # 수동 즉시 테스트 버튼 활성화

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests pandas numpy

      - name: Run Binance Top 5 Pre-Surge Analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python binance_analyzer.py
