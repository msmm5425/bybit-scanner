name: Bybit Multi-Timeframe Scanner

on:
  schedule:
    # 24시간 4시간 간격 비혼잡 6슬롯 (UTC 00:17, 04:17, 08:17, 12:17, 16:17, 20:17)
    # KST 기준: 01:17, 05:17, 09:17, 13:17, 17:17, 21:17
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      test_video:
        description: '최근 익절 종목 세로형 리플레이 영상 2종(클린+자막/일본어음성) 즉시 테스트 발송'
        required: false
        default: false
        type: boolean

concurrency:
  # test_video 수동 테스트는 별도 그룹으로 분리해 정기 릴레이 스캔과 상호 간섭·대기 차단
  group: ${{ (github.event_name == 'workflow_dispatch' && (inputs.test_video == true || github.event.inputs.test_video == 'true')) && 'bybit-scanner-video-test' || 'bybit-scanner-main' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python packages
        run: |
          if [ -f requirements.txt ]; then
            pip install -q -r requirements.txt
          else
            pip install -q requests pandas numpy playwright edge-tts gTTS
          fi

      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Chromium browser & system deps
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Cache lightweight-charts JS asset
        id: lw-js-cache
        uses: actions/cache@v4
        with:
          path: assets/lightweight-charts.standalone.production.js
          key: lw-charts-js-4.2.0

      - name: Download lightweight-charts JS asset (if cache miss)
        if: ${{ steps.lw-js-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p assets
          curl -fsSL https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js -o assets/lightweight-charts.standalone.production.js || \
          curl -fsSL https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js -o assets/lightweight-charts.standalone.production.js || true

      - name: Ensure ffmpeg and Korean CJK font are available
        run: |
          NEED_UPDATE=0
          which ffmpeg >/dev/null 2>&1 || NEED_UPDATE=1
          fc-list :lang=ko 2>/dev/null | grep -qi noto || NEED_UPDATE=1
          if [ "$NEED_UPDATE" -eq 1 ]; then
            sudo apt-get update -qq
            which ffmpeg >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg
            fc-list :lang=ko 2>/dev/null | grep -qi noto || sudo apt-get install -y -qq fonts-noto-cjk
          fi

      - name: Run Replay Video Test (if selected)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_video == true }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BYBIT_PROXY_URL: ${{ secrets.BYBIT_PROXY_URL }}
        run: python scanner.py --test-video

      - name: Run Scanner Loop
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_video == true) }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BYBIT_PROXY_URL: ${{ secrets.BYBIT_PROXY_URL }}
        run: python scanner.py --loop
