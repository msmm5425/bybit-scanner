name: Bybit 5m Crypto Scanner

on:
  schedule:
    # 깃허브 스케줄러를 계속 깨우기 위해 5분 트리거 유지
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# [핵심] 이미 5분 연속 루프가 돌아가고 있으면 취소하지 않고 대기열에서 바통 터치!
concurrency:
  group: bybit-5m-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치 (1시간에 1번만 설치하여 속도 최적화)
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 4. 55분간 5분봉 마감 시각마다 연속 스캔 실행 (총 11회)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for i in {1..11}; do
            echo "=========================================="
            echo "🔄 [회차 $i/11] 실시간 스캔 시작: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')"
            echo "=========================================="

            # 최신 bot_state.json 동기화 후 스캐너 실행
            git pull --rebase origin main || true
            python scanner.py || true

            # 포착 종목이 있어 bot_state.json이 변경되었다면 즉시 저장소에 반영
            if [ -f bot_state.json ]; then
              git add bot_state.json
              git diff --staged --quiet || (git commit -m "chore: update bot_state.json [skip ci]" && git push) || true
            fi

            # 마지막 11회차가 아니면 다음 5분봉 마감 직후(+3초)까지 정확히 대기
            if [ "$i" -lt 11 ]; then
              NOW_SEC=$(date +%s)
              SLEEP_SEC=$(( 300 - (NOW_SEC % 300) + 3 ))
              echo "⏳ 다음 5분봉 마감까지 ${SLEEP_SEC}초 대기합니다..."
              sleep $SLEEP_SEC
            fi
          done
