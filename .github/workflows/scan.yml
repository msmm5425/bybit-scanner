name: Bybit 30M Monitor

on:
  schedule:
    - cron: '0,30 * * * *'  # 매시 정각(00분) 및 30분 정각 실행
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests pandas numpy

      - name: Run 30M Scanner & Telegram Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save Bot State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f bot_state.json ]; then
            git add bot_state.json
            git diff --staged --quiet || git commit -m "Update bot_state.json [skip ci]"
            git push
          fi
