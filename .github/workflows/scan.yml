name: Bybit Multi-Timeframe Scanner

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_video:
        description: '최근 익절 종목 30초 리플레이 영상 즉시 테스트 발송'
        required: false
        default: false
        type: boolean

concurrency:
  group: bybit-scanner-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install --upgrade pip requests pandas numpy playwright

      - name: Install Chromium browser
        run: playwright install --with-deps chromium

      - name: Ensure ffmpeg is available
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run Replay Video Test (if selected)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_video == true }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scanner.py --test-video

      - name: Run Scanner Loop
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_video == true) }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scanner.py --loop
