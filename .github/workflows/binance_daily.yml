name: Bybit Top 5 Daily Analyzer

on:
  schedule:
    # 매일 13:00 KST 실행 (UTC 기준 04:00)
    - cron: '0 4 * * *'
  workflow_dispatch: # 깃허브 화면에서 [Run workflow] 수동 테스트 버튼 활성화

permissions:
  contents: write # analyzer_history.json 파일을 저장소에 자동 저장하기 위한 필수 권한

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 4. 상위 5개 분석 및 48시간 사후검증 실행 (binance_analyzer.py)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python binance_analyzer.py

      - name: 5. 48시간 추적용 기록 파일(analyzer_history.json) 자동 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f analyzer_history.json ]; then
            git add analyzer_history.json
            git diff --staged --quiet || (git commit -m "chore: update 48h analyzer_history.json [skip ci]" && git pull --rebase origin main && git push)
          fi
