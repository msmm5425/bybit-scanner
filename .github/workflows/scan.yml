name: Bybit Multi-Timeframe Scanner
​on:
schedule:
- cron: '0 * * * *'
workflow_dispatch:
​concurrency:
group: bybit-scanner-main
cancel-in-progress: true
​permissions:
contents: write
​jobs:
scan:
runs-on: ubuntu-latest
timeout-minutes: 50
steps:
- name: 1. 저장소 코드 불러오기
uses: actions/checkout@v4
with:
fetch-depth: 0
​- name: 2. 파이썬 설치
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: 3. 필수 라이브러리 및 차트 엔진 설치
run: |
python -m pip install --upgrade pip
pip install requests pandas numpy playwright
playwright install --with-deps chromium
​- name: 4. 5분 주기 멀티프레임 스캔 및 상태 무손실 병합 동기화
env:
TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
CHAT_ID: ${{ secrets.CHAT_ID }}
run: |
git config --local user.email "actions@github.com"
git config --local user.name "GitHub Actions"
​for i in {1..9}; do
echo "=== [회차 $i/9] 5분 주기 스캔 시작: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
​git fetch origin main || true
git checkout origin/main -- scanner_state.json 2>/dev/null || true
​python scanner.py || echo "[경고] 스캔 실행 중 일시적 예외 발생"
​if [ -f /tmp/scanner_runtime_state.json ]; then
cp /tmp/scanner_runtime_state.json scanner_state.json
fi
​if [ -f scanner_state.json ]; then
cp scanner_state.json /tmp/scanner_state_push_ready.json
for retry in 1 2 3; do
git fetch origin main || true
git reset --soft origin/main || true
cp /tmp/scanner_state_push_ready.json scanner_state.json
git add scanner_state.json
if ! git diff --staged --quiet; then
git commit -m "chore: update scanner state [skip ci]" || true
if git push origin HEAD:main; then
break
fi
else
break
fi
sleep 2
done
fi
​if [ "$i" -lt 9 ]; then
echo "다음 5분 스캔까지 295초 대기..."
sleep 295
fi
done